    <script>
      (function() {
        // Ensure window.fetch has both a getter and setter to support extension interceptors
        try {
          var _rawFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() {
              return _rawFetch;
            },
            set: function(val) {
              _rawFetch = val;
            }
          });
        } catch (e) {
          try {
            Object.defineProperty(window, 'fetch', {
              value: window.fetch,
              writable: true,
              configurable: true,
              enumerable: true
            });
          } catch (_) {}
        }

        // Suppress unhandled extension errors from breaking the page
        window.addEventListener('error', function(event) {
          if (
            (event.filename && (event.filename.indexOf('chrome-extension://') !== -1 || event.filename.indexOf('moz-extension://') !== -1)) ||
            (event.message && event.message.indexOf('Cannot set property fetch of #<Window>') !== -1)
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
